name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time only; no real secrets are needed to compile the app.
      SESSION_SECRET: "ci-build-secret-not-used-at-runtime-0000000000"
      APP_ORIGIN: "https://ci.invalid"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-exact, no lifecycle scripts)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build